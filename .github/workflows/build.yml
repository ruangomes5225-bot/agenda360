name: Compilar Agenda 360

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache da toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v1

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev libpng-dev libfreetype-dev zlib1g-dev wget

      - name: Compilar toolchain e libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          sudo mkdir -p /usr/local/xenon
          sudo chown -R $USER /usr/local/xenon
          export DEVKITXENON=/usr/local/xenon
          ./build-xenon-toolchain toolchain
          cd ..
          export PATH=$PATH:/usr/local/xenon/bin
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs

      - name: Compilar a Agenda
        run: |
          export DEVKITXENON=/usr/local/xenon
          make

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: agenda360
          path: agenda360.elf32
