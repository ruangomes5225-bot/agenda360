name: Compilar Agenda 360

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar cache da toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v2

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison libgmp-dev libmpfr-dev libmpc-dev libpng-dev libfreetype-dev zlib1g-dev wget

      - name: Baixar libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Free60Project/libxenon.git "$HOME/libxenon"
          sudo mkdir -p /usr/local/xenon
          sudo chown -R $USER /usr/local/xenon

      - name: Compilar toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export DEVKITXENON=/usr/local/xenon
          cd "$HOME/libxenon/toolchain"
          ls
          ./build-xenon-toolchain toolchain

      - name: Compilar libxenon
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:/usr/local/xenon/bin
          cd "$HOME/libxenon/toolchain"
          ./build-xenon-toolchain libxenon
          ./build-xenon-toolchain libs

      - name: Salvar cache completo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v2

      - name: Compilar a Agenda
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:/usr/local/xenon/bin
          make

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: agenda360
          path: agenda360.elf32
